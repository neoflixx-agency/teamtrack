const AFK_IDLE_MINS = 10       // minutes of no mouse/keyboard → AFK warning
const AFK_AUTO_OUT_MINS = 2    // extra minutes after warning → auto pause session
const WORK_DAYS = [1,2,3,4,5,6]
const pad = n => String(n).padStart(2,"0")

// Check if current time is past auto-absent threshold
function isPastAbsentThreshold(){
  const n=new Date(), now=n.getHours()*60+n.getMinutes()
  const[h,m]=AUTO_ABSENT_TIME.split(":").map(Number)
  return now>=(h*60+m)
}

// Validate time is not in the future
function isFuture(t){ if(!t)return false; const[h,m]=t.split(":").map(Number),n=new Date(); return (h*60+m)>(n.getHours()*60+n.getMinutes()); }
function isBeforeTime(t1,t2){ if(!t1||!t2)return false; const[h1,m1]=t1.split(":").map(Number),[h2,m2]=t2.split(":").map(Number); return (h1*60+m1)<(h2*60+m2); }
// 5-min back rule: entered time cannot be more than 5 min before current time
function isTooEarly(t){ if(!t)return false; const[h,m]=t.split(":").map(Number),n=new Date(),nowMins=n.getHours()*60+n.getMinutes(); return (h*60+m)<(nowMins-5); }
// earliest allowed time = now - 5 min
function minAllowedTime(){ const n=new Date(); let m=n.getHours()*60+n.getMinutes()-5; if(m<0)m=0; return `${pad(Math.floor(m/60))}:${pad(m%60)}`; }
// Total office time = first login → end_of_day time (if set) or now
// Includes lunch gaps — it's the full span inside the office building
function totalOfficeMins(sessions, attRec){
  const fl=firstLogin(sessions); if(!fl)return 0;
  const lo=endOfDayTime(attRec)||nowTime();
  return calcMins(fl,lo);
}
// Total lunch/break mins = office time - working time
function totalBreakMins(sessions, attRec){
  return Math.max(0, totalOfficeMins(sessions,attRec) - totalSessionMins(sessions));
}

// Sessions helpers - sessions = [{login, logout}]
// Backward compat: if old record has login_time/logout_time, treat as single session
function getSessions(rec){
  if(!rec)return[]
  if(rec.sessions&&rec.sessions.length)return rec.sessions
  if(rec.login_time)return[{login:rec.login_time,logout:rec.logout_time||null}]
  return[]
}
function totalSessionMins(sessions){
  return sessions.reduce((s,sess)=>{
    if(!sess.login)return s
    if(sess.logout)return s+calcMins(sess.login,sess.logout)
    return s+calcMins(sess.login,nowTime())
  },0)
}
function isCurrentlyIn(sessions){
  if(!sessions.length)return false
  return !sessions[sessions.length-1].logout
}
function firstLogin(sessions){ return sessions[0]?.login||null }
function lastLogout(sessions){
  // Returns the most recent logout time (last closed session)
  const done=sessions.filter(s=>s.logout)
  return done.length?done[done.length-1].logout:null
}
// The "end of day" logout — only valid when attRec.end_of_day is set
function endOfDayTime(attRec){
  return attRec?.end_of_day||null
}

function fmtDate(iso,opts={weekday:"short",day:"numeric",month:"short"}){
  return new Date(iso+"T00:00:00").toLocaleDateString("en-IN",opts)
}
function fmtMonth(ym){const[y,m]=ym.split("-");return new Date(y,m-1).toLocaleDateString("en-IN",{month:"long",year:"numeric"})}
function calcMins(t1,t2){
  if(!t1||!t2)return 0
  const[h1,m1]=t1.split(":").map(Number),[h2,m2]=t2.split(":").map(Number)
  return Math.max(0,(h2*60+m2)-(h1*60+m1))
}
function fmtDur(mins){
  if(!mins||mins<=0)return"—"
  if(mins<60)return`${mins}m`
  return`${Math.floor(mins/60)}h ${mins%60>0?mins%60+"m":""}`
}
const isLate = t => !!t && t > OFFICE_START

function workingDaysSoFar(ym){
  const[y,m]=ym.split("-").map(Number),today=todayISO(),days=new Date(y,m,0).getDate(),res=[]
  for(let d=1;d<=days;d++){const iso=`${y}-${pad(m)}-${pad(d)}`;if(iso>today)break;if(WORK_DAYS.includes(new Date(y,m-1,d).getDay()))res.push(iso)}
  return res
}

// ─── AFK IDLE HOOK ───────────────────────────────────────────────────────────
// Tracks mouse/keyboard activity. Returns {afkState, afkIdleSecs, resetAfk}
// afkState: "active" | "warning" | "autoout"
function useAfkIdle(enabled){
  const[afkState,setAfkState]=useState("active")
  const[idleSecs,setIdleSecs]=useState(0)
  const lastActivity=useRef(Date.now())
  const intervalRef=useRef(null)

  const reset=useCallback(()=>{
    lastActivity.current=Date.now()
    setAfkState("active")
    setIdleSecs(0)
  },[])

  useEffect(()=>{
    if(!enabled){setAfkState("active");setIdleSecs(0);return}
    const events=["mousemove","mousedown","keydown","touchstart","scroll","click"]
    const onActivity=()=>{
      lastActivity.current=Date.now()
      // only snap back to active when in warning state (user moved = they're back)
      setAfkState(s=>{
        if(s==="warning"||s==="autoout")return s // don't auto-reset — let banner handle it
        return "active"
      })
      setIdleSecs(0)
    }
    events.forEach(e=>window.addEventListener(e,onActivity,{passive:true}))
    // Reset idle timer whenever user comes back to this tab
    const onVisible=()=>{ if(document.visibilityState==="visible") lastActivity.current=Date.now() }
    document.addEventListener("visibilitychange",onVisible)
    intervalRef.current=setInterval(()=>{
      // Don't count idle time while tab is hidden — user is working elsewhere
      if(document.visibilityState==="hidden"){ lastActivity.current=Date.now(); return }
      const elapsed=Math.floor((Date.now()-lastActivity.current)/1000)
      setIdleSecs(elapsed)
      const warnAt=AFK_IDLE_MINS*60
      const outAt=(AFK_IDLE_MINS+AFK_AUTO_OUT_MINS)*60
      if(elapsed>=outAt) setAfkState("autoout")
      else if(elapsed>=warnAt) setAfkState("warning")
      else setAfkState("active")
    },1000)
    return()=>{
      events.forEach(e=>window.removeEventListener(e,onActivity))
      document.removeEventListener("visibilitychange",onVisible)
      clearInterval(intervalRef.current)
    }
  },[enabled])

  return {afkState,idleSecs,resetAfk:reset}
}

// AFK warning banner — fixed overlay at top of screen
function AfkBanner({afkState,idleSecs,onImBack,onAutoOut}){
  // trigger autoout callback once
  const firedRef=useRef(false)
  useEffect(()=>{
    if(afkState==="autoout"&&!firedRef.current){firedRef.current=true;onAutoOut()}
  },[afkState])
  useEffect(()=>{if(afkState==="active")firedRef.current=false},[afkState])

  if(afkState==="active")return null

  const idleMin=Math.floor(idleSecs/60), idleSec=idleSecs%60
  const isAutoOut=afkState==="autoout"
  const countdownSecs=isAutoOut?0:Math.max(0,(AFK_IDLE_MINS+AFK_AUTO_OUT_MINS)*60-idleSecs)
  const countMin=Math.floor(countdownSecs/60), countSec=countdownSecs%60

  return <div style={{position:"fixed",top:0,left:0,right:0,zIndex:200,background:isAutoOut?"#7F1D1D":"#78350F",borderBottom:`3px solid ${isAutoOut?"#DC2626":"#D97706"}`,padding:"10px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,flexWrap:"wrap",boxShadow:"0 4px 20px rgba(0,0,0,0.3)"}}>
    <div style={{display:"flex",alignItems:"center",gap:10}}>
      <span style={{fontSize:20}}>{isAutoOut?"⏸":"😴"}</span>
      <div>
        <div style={{fontSize:13,fontWeight:700,color:"#FDE68A"}}>{isAutoOut?"Working time paused — you were AFK":`AFK detected — idle for ${idleMin}m ${idleSec}s`}</div>
        <div style={{fontSize:11,color:"rgba(253,230,138,0.7)"}}>
          {isAutoOut
            ?"Your session was auto-paused. Click below to resume working."
            :`Working timer will auto-pause in ${countMin}m ${String(countSec).padStart(2,"0")}s if no activity`}
        </div>
      </div>
    </div>
    <button type="button" onClick={onImBack} style={{border:"none",borderRadius:8,padding:"9px 20px",background:"#FDE68A",color:"#78350F",cursor:"pointer",fontSize:13,fontWeight:800,fontFamily:"inherit",whiteSpace:"nowrap",flexShrink:0}}>
      {isAutoOut?"▶ Resume working":"✋ I'm here!"}
    </button>
  </div>
}

  const isRunning = task.status === "running"
  const borderColor = isRunning?"#C7D2FE":task.status==="done"?"#BBF7D0":"#FECACA"
  const bg = isRunning?"#EEF2FF":task.status==="done"?"#F0FDF4":"#FEF2F2"

  return <div style={{background:bg,border:`1.5px solid ${borderColor}`,borderRadius:10,padding:"12px 14px"}}>
    <div style={{display:"flex",alignItems:"flex-start",gap:10}}>
      <div style={{flex:1}}>
        <div style={{fontWeight:600,fontSize:14,color:task.status==="done"?C.muted:C.ink,textDecoration:task.status==="done"?"line-through":"none",marginBottom:6}}>{task.task_name||task.name}</div>
        {/* Time row */}
        <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
          <span style={{fontSize:12,color:C.muted,display:"flex",alignItems:"center",gap:4}}>
            <span style={{fontSize:10,color:C.faint}}>▶ Start</span>
            <strong style={{color:C.ink}}>{task.start_time||"—"}</strong>
          </span>
          {task.end_time&&<span style={{fontSize:12,color:C.muted,display:"flex",alignItems:"center",gap:4}}>
            <span style={{fontSize:10,color:C.faint}}>■ End</span>
            <strong style={{color:C.ink}}>{task.end_time}</strong>
          </span>}
          {task.start_time&&<span style={{fontSize:12,fontWeight:700,color:isRunning?C.primary:C.success,marginLeft:"auto"}}>
            {isRunning?"⏳ ":""}{fmtDur(dur)}
          </span>}
        </div>
        {task.status==="blocked"&&<div style={{marginTop:6,fontSize:12,color:C.danger,fontWeight:600}}>⚠ Blocked</div>}
      </div>
      {/* Actions */}
      <div style={{display:"flex",flexDirection:"column",gap:5,flexShrink:0}}>
        {canFinish&&isRunning&&<button type="button" onClick={()=>onFinish(task)} style={{border:"none",borderRadius:7,padding:"6px 12px",cursor:"pointer",fontSize:12,color:C.white,fontWeight:700,background:G.brand,fontFamily:"inherit",whiteSpace:"nowrap"}}>Mark done</button>}

      </div>

}

  if(!loginTime)return null
  const toPct=t=>{const[h,m]=t.split(":").map(Number);return Math.max(0,Math.min(100,((h*60+m-360)/960)*100))}
  const l=toPct(loginTime),r=logoutTime?toPct(logoutTime):toPct(nowTime()),open=!logoutTime
  return <div>
    <div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:4}}>
      <span style={{color:isLate(loginTime)?C.danger:C.muted,fontWeight:600}}>{loginTime}{isLate(loginTime)&&<span style={{color:C.danger}}> · Late</span>}</span>

}

// ─── CHECK-IN MODAL ───────────────────────────────────────────────────────────
function CheckInModal({open,onClose,onSave,user,existing}){
  const[att,setAtt]=useState("present")
  const[loginTime,setLoginTime]=useState(nowTime())
  const[saving,setSaving]=useState(false)
  const[err,setErr]=useState("")

  useEffect(()=>{
    if(!open)return;setErr("")
    if(existing){
      setAtt(existing.attendance||"present")
      // For re-login: default to now
      setLoginTime(nowTime())
    } else {
      setAtt("present");setLoginTime(nowTime())
    }
  },[open,existing])

  const isRelogin = existing && getSessions(existing).length>0 && !isCurrentlyIn(getSessions(existing))

  async function save(){
    if(att==="present"&&!loginTime){setErr("Please enter your login time.");return}
    if(att==="present"&&isFuture(loginTime)){setErr("Login time cannot be in the future.");return}
    if(att==="present"&&isTooEarly(loginTime)){setErr(`Time too early — you can only enter a time within 5 minutes of now (earliest: ${minAllowedTime()}).`);return}
    setSaving(true)

    let sessions = getSessions(existing)
    let payload

    if(att==="present"&&existing){
      // Add new session or start fresh
      if(isRelogin){
        // Re-login: add new session
        sessions = [...sessions, {login:loginTime, logout:null}]
      } else if(sessions.length===0){
        sessions = [{login:loginTime, logout:null}]
      }
      payload={
        ...existing,
        attendance:"present",
        sessions,
        login_time:firstLogin(sessions),
        logout_time:null,
        summary:existing.summary||""
      }
    } else {
      payload={
        id:existing?.id||`att_${user.toLowerCase().replace(/\s+/g,"_")}_${todayISO()}_${uid()}`,
        name:user, date:todayISO(), type:"attendance",
        attendance:att,
        sessions:att==="present"?[{login:loginTime,logout:null}]:[],
        login_time:att==="present"?loginTime:null,
        logout_time:null,
        summary:existing?.summary||""
      }
    }
    await onSave(payload)
    setSaving(false);onClose()
  }

  return <Modal open={open} onClose={onClose} width={420}>

// ─── TASK GATE MODAL (pre-logout: resolve all running tasks) ─────────────────
function TaskGateModal({open,onClose,runningTasks,onSave,onProceed}){
  // Each running task needs to be either "done" (with end time) or have a reason
  const initState = () => runningTasks.reduce((acc,t)=>({...acc,[t.id]:{action:"done",endTime:nowTime(),reason:""}}),{})
  const[state,setState]=useState(initState)
  const[saving,setSaving]=useState(false)
  const[err,setErr]=useState("")

  useEffect(()=>{if(open)setState(initState())},[open,runningTasks.length])

  const set=(id,key,val)=>setState(s=>({...s,[id]:{...s[id],[key]:val}}))

  async function proceed(){
    // validate
    for(const t of runningTasks){
      const s=state[t.id]
      if(s.action==="done"&&isFuture(s.endTime)){setErr(`End time for "${t.task_name}" cannot be in the future.`);return}
      if(s.action==="reason"&&!s.reason.trim()){setErr(`Please enter a reason for "${t.task_name}" or mark it done.`);return}
    }
    setSaving(true)
    try{
      for(const t of runningTasks){
        const s=state[t.id]
        if(s.action==="done"){
          await onSave({...t,end_time:s.endTime,status:"done"})
        } else {
          await onSave({...t,end_time:nowTime(),status:"blocked",summary:s.reason})
        }
      }
      onProceed() // open the actual checkout modal
    }finally{setSaving(false)}
  }

  if(!open)return null
  return <Modal open={open} onClose={onClose} width={480}>
    <div style={{padding:"20px 24px 14px",background:"linear-gradient(135deg,#FFF7ED,#FFEDD5)",borderBottom:`1px solid ${C.line}`}}>
      <h2 style={{margin:0,fontSize:18,fontWeight:800,color:"#9A3412"}}>⚠️ Unfinished tasks</h2>
      <p style={{margin:"4px 0 0",fontSize:13,color:"#C2410C"}}>Before you end the day, report each task — mark it done or explain why it's pending.</p>
    </div>
    <div style={{padding:"16px 24px",display:"flex",flexDirection:"column",gap:14,maxHeight:"60vh",overflowY:"auto"}}>
      {runningTasks.map(t=>{
        const s=state[t.id]||{action:"done",endTime:nowTime(),reason:""}
        return <div key={t.id} style={{border:`1.5px solid ${C.line}`,borderRadius:12,overflow:"hidden"}}>
          <div style={{background:C.surface,padding:"10px 14px",borderBottom:`1px solid ${C.line}`}}>
            <div style={{fontWeight:700,fontSize:13,color:C.ink}}>▶ {t.task_name}</div>
            <div style={{fontSize:11,color:C.muted,marginTop:2}}>Started {t.start_time}</div>
          </div>
          <div style={{padding:"12px 14px",display:"flex",flexDirection:"column",gap:10}}>
            {/* Toggle: done vs pending reason */}
            <div style={{display:"flex",gap:8}}>
              <button type="button" onClick={()=>set(t.id,"action","done")} style={{flex:1,padding:"8px",borderRadius:8,border:"1.5px solid",borderColor:s.action==="done"?C.success:C.line,background:s.action==="done"?"#DCFCE7":C.white,color:s.action==="done"?C.success:C.muted,fontWeight:700,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>
                ✓ Mark done
              </button>
              <button type="button" onClick={()=>set(t.id,"action","reason")} style={{flex:1,padding:"8px",borderRadius:8,border:"1.5px solid",borderColor:s.action==="reason"?C.warning:C.line,background:s.action==="reason"?"#FFF7ED":C.white,color:s.action==="reason"?C.warning:C.muted,fontWeight:700,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>
                📝 Pending / reason
              </button>
            </div>
            {s.action==="done"&&<div>
              <label style={LBL}>Finish time</label>
              <input type="time" style={INP} value={s.endTime} max={nowTime()} onChange={e=>set(t.id,"endTime",e.target.value)}/>
              {isFuture(s.endTime)&&<p style={{margin:"4px 0 0",fontSize:11,color:C.danger,fontWeight:600}}>⚠ Cannot be in the future</p>}
            </div>}
            {s.action==="reason"&&<div>
              <label style={LBL}>Why is it pending?</label>
              <input style={INP} value={s.reason} onChange={e=>set(t.id,"reason",e.target.value)} placeholder="e.g. Waiting for client feedback, continuing tomorrow…"/>
            </div>}
          </div>
        </div>
      })}
    </div>
    {err&&<div style={{padding:"0 24px 10px"}}><p style={{color:C.danger,fontSize:13,fontWeight:500,margin:0}}>{err}</p></div>}
    <div style={{padding:"12px 24px",borderTop:`1px solid ${C.line}`,display:"flex",justifyContent:"flex-end",gap:10,background:C.surface}}>
      <button type="button" onClick={onClose} style={{padding:"9px 18px",border:`1.5px solid ${C.line}`,borderRadius:9,background:"none",cursor:"pointer",fontSize:14,color:C.muted,fontFamily:"inherit"}}>Cancel</button>
      <button type="button" onClick={proceed} disabled={saving} style={{padding:"9px 22px",border:"none",borderRadius:9,background:G.brand,color:C.white,cursor:"pointer",fontSize:14,fontWeight:700,opacity:saving?.7:1,fontFamily:"inherit"}}>{saving?"Saving…":"Save & proceed →"}</button>
    </div>
  </Modal>
}

// ─── CHECK-OUT MODAL ──────────────────────────────────────────────────────────
function CheckOutModal({open,onClose,onSave,attRecord,mode}){
  const[logoutTime,setLogoutTime]=useState(nowTime())
  const[summary,setSummary]=useState("")
  const[saving,setSaving]=useState(false)
  const[outErr,setOutErr]=useState("")

  const sessions = getSessions(attRecord)
  const currentSession = sessions[sessions.length-1]
  const currentLoginTime = currentSession?.login

  useEffect(()=>{if(open){setLogoutTime(nowTime());setSummary(attRecord?.summary||"");setOutErr("")}},[open,attRecord])
  if(!attRecord)return null

  const sessionMins = calcMins(currentLoginTime, logoutTime)
  const totalAfter = sessions.slice(0,-1).reduce((s,sess)=>sess.logout?s+calcMins(sess.login,sess.logout):s,0) + sessionMins

  async function save(){
    if(isFuture(logoutTime)){setOutErr("Logout time cannot be in the future.");return}
    if(isTooEarly(logoutTime)){setOutErr(`Time too early — earliest allowed is ${minAllowedTime()}.`);return}
    if(currentLoginTime&&!isBeforeTime(currentLoginTime,logoutTime)&&currentLoginTime!==logoutTime){setOutErr(`Logout must be after login time (${currentLoginTime}).`);return}
    setSaving(true)
    // Close the current session
    const newSessions = sessions.map((s,i)=>i===sessions.length-1?{...s,logout:logoutTime}:s)
    const payload = {
      ...attRecord,
      sessions:newSessions,
      logout_time:logoutTime,
      summary
    }
    if(mode==="endday") payload.end_of_day = logoutTime  // marks day as truly done
    await onSave(payload)
    setSaving(false);onClose()
  }

  return <Modal open={open} onClose={onClose} width={420}>
    <div style={{padding:"20px 24px 14px",background:mode==="endday"?"linear-gradient(135deg,#FFF1F2,#FFE4E6)":"linear-gradient(135deg,#FFFBEB,#FEF3C7)",borderBottom:`1px solid ${C.line}`}}>
      <h2 style={{margin:0,fontSize:18,fontWeight:800,color:mode==="endday"?"#9F1239":"#92400E"}}>{mode==="endday"?"🚪 Ending your day":"🍽️ Going for lunch / stepping out"}</h2>
      <p style={{margin:"3px 0 0",fontSize:13,color:mode==="endday"?C.danger:C.warning}}>{mode==="endday"?"You won't be able to re-login after this.":"You can re-login when you're back."}</p>
      {sessions.length>1&&<p style={{margin:"4px 0 0",fontSize:12,color:C.warning}}>Session {sessions.length} of {sessions.length} · Previous sessions: {fmtDur(sessions.slice(0,-1).reduce((s,sess)=>sess.logout?s+calcMins(sess.login,sess.logout):s,0))}</p>}
    </div>
    <div style={{padding:"18px 24px",display:"flex",flexDirection:"column",gap:14}}>
      <div style={{background:C.surface,borderRadius:9,padding:"11px 14px",border:`1px solid ${C.line}`}}>
        <div style={{fontSize:11,color:C.faint,marginBottom:2}}>Current session started at</div>
        <div style={{fontSize:16,fontWeight:800,color:C.ink}}>{currentLoginTime||"—"}</div>
        {sessionMins>0&&<div style={{fontSize:12,color:C.primary,fontWeight:600,marginTop:2}}>This session: {fmtDur(sessionMins)} · Total today: {fmtDur(totalAfter)}</div>}
      </div>
      <div>
        <label style={LBL}>What time are you leaving?</label>
        <input type="time" style={INP} value={logoutTime} min={minAllowedTime()} max={nowTime()} onChange={e=>setLogoutTime(e.target.value)}/>
        <p style={{margin:"5px 0 0",fontSize:11,color:C.muted}}>⏱ Allowed: {minAllowedTime()} – {nowTime()} (within 5 min of now)</p>
        {isFuture(logoutTime)&&<p style={{margin:"4px 0 0",fontSize:12,color:C.danger,fontWeight:600}}>⚠ Cannot be in the future</p>}
        {isTooEarly(logoutTime)&&<p style={{margin:"4px 0 0",fontSize:12,color:C.danger,fontWeight:600}}>⚠ Too early — earliest allowed is {minAllowedTime()}</p>}
      </div>
      <div>
        <label style={LBL}>Note <span style={{fontWeight:400,textTransform:"none"}}>(optional)</span></label>
        <textarea style={{...INP,minHeight:58,resize:"vertical",lineHeight:1.55}} value={summary} onChange={e=>setSummary(e.target.value)} placeholder="Any notes…"/>
      </div>
    </div>
    {outErr&&<div style={{padding:"0 24px 12px"}}><p style={{color:C.danger,fontSize:13,fontWeight:500,margin:0}}>{outErr}</p></div>}
    <div style={{padding:"12px 24px",borderTop:`1px solid ${C.line}`,display:"flex",justifyContent:"flex-end",gap:10,background:C.surface}}>
      <button type="button" onClick={onClose} style={{padding:"9px 18px",border:`1.5px solid ${C.line}`,borderRadius:9,background:"none",cursor:"pointer",fontSize:14,color:C.muted,fontFamily:"inherit"}}>Cancel</button>
      <button type="button" onClick={save} disabled={saving} style={{padding:"9px 22px",border:"none",borderRadius:9,background:C.warning,color:C.white,cursor:"pointer",fontSize:14,fontWeight:700,opacity:saving?.7:1,fontFamily:"inherit"}}>{saving?"Saving…":"Log out"}</button>
    </div>
  </Modal>
}

// ─── EMPLOYEE DASHBOARD ───────────────────────────────────────────────────────
function EmpDashboard({user,records,onSave,onDelete,showToast,onLogout}){
  const todayISOf = todayISO()
  const todayRecs = records.filter(r=>r.name===user&&r.date===todayISOf)
  const attRec    = todayRecs.find(r=>r.type==="attendance")
  const taskRecs  = todayRecs.filter(r=>r.type==="task").sort((a,b)=>a.start_time?.localeCompare(b.start_time))

  const sessions     = getSessions(attRec)
  const isPresent    = attRec?.attendance==="present" || (!attRec?.attendance && !!attRec?.login_time)
  const isCurrentlyLoggedIn = isPresent && isCurrentlyIn(sessions)
  // isCheckedOut = stepped out (lunch / break) — can re-login
  // isDoneForDay = explicitly marked end of day via the "End Day" button
  const isCheckedOut = isPresent && sessions.length>0 && !isCurrentlyLoggedIn && !attRec?.end_of_day
  const isDoneForDay = isPresent && !!attRec?.end_of_day
  const totalWorkMins = totalSessionMins(sessions)
  const runningTasks= taskRecs.filter(t=>t.status==="running")
  const doneTasks   = taskRecs.filter(t=>t.status==="done")
  const totalTaskMins = taskRecs.reduce((s,t)=>s+calcMins(t.start_time,t.end_time||nowTime()),0)

  const[checkInOpen, setCheckInOpen]=useState(false)
  const[addTaskOpen, setAddTaskOpen]=useState(false)
  const[checkOutOpen,setCheckOutOpen]=useState(false)
  const[checkOutMode,setCheckOutMode]=useState("lunch") // "lunch" or "endday"
  const[taskGateOpen,setTaskGateOpen]=useState(false)
  // End day: if running tasks exist, show gate first; else open checkout directly
  const openEndDay=()=>{
    if(runningTasks.length>0){setTaskGateOpen(true)}
    else{setCheckOutMode("endday");setCheckOutOpen(true)}
  }
  const openCheckOut=(mode)=>{setCheckOutMode(mode);setCheckOutOpen(true)}
  const[finishTask,  setFinishTask]=useState(null)
  const[delTarget,   setDelTarget]=useState(null)

  // ── AFK IDLE DETECTION ──────────────────────────────────────────────────────
  // Only active when employee is currently logged in (not on lunch, not done)
  const afkEnabled = isCurrentlyLoggedIn && !isDoneForDay
  const{afkState,idleSecs,resetAfk}=useAfkIdle(afkEnabled)
  const[afkAutoOutTime,setAfkAutoOutTime]=useState(null) // time when auto-out fired

  // Auto-out: close current session silently (like lunch break)
  const handleAfkAutoOut=useCallback(async()=>{
    if(!attRec||!isCurrentlyLoggedIn)return
    const t=nowTime()
    setAfkAutoOutTime(t)
    const sessions=getSessions(attRec)
    const newSessions=sessions.map((s,i)=>i===sessions.length-1?{...s,logout:t}:s)
    await onSave({...attRec,sessions:newSessions,logout_time:t})
  },[attRec,isCurrentlyLoggedIn,onSave])

  // "I'm back" / "Resume" — if auto-out already happened, create new session
  const handleAfkReturn=useCallback(async()=>{
    resetAfk()
    if(afkState==="autoout"&&afkAutoOutTime){
      // open re-login modal pre-filled with now
      setAfkAutoOutTime(null)
      setCheckInOpen(true)  // re-login modal
    }
    // if just "warning" state, resetAfk is enough — session was never paused
  },[afkState,afkAutoOutTime,resetAfk])

  // monthly stats - handle both old records (no type) and new records
  const myMonth = records.filter(r=>r.name===user&&mk(r.date)===mk(todayISOf)&&(r.type==="attendance"||(!r.type&&r.login_time)))
  const wd = workingDaysSoFar(mk(todayISOf))
  const presentDays = myMonth.filter(r=>r.attendance==="present"||(!r.attendance&&r.login_time))
  const attPct = wd.length?Math.round((presentDays.length/wd.length)*100):0
  const allTasks = records.filter(r=>r.name===user&&(r.type==="task"||(r.tasks&&r.tasks.length)))

  return <div style={{minHeight:"100vh",background:G.canvas}}>

    {/* Topbar */}
    <div style={{background:C.white,borderBottom:`1px solid ${C.line}`,position:"sticky",top:0,zIndex:50}}>
      <div style={{maxWidth:680,margin:"0 auto",padding:"0 20px",display:"flex",alignItems:"center",gap:10,height:56}}>
        <div style={{width:28,height:28,borderRadius:7,background:G.brand,display:"flex",alignItems:"center",justifyContent:"center"}}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.5" strokeLinecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div>
        <span style={{fontWeight:800,fontSize:14,color:"#1E1B4B"}}>TeamTrack</span>
        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:9}}>
          <div style={{display:"flex",alignItems:"center",gap:8,padding:"5px 12px",background:G.soft,borderRadius:99}}><Avatar name={user} size={22}/><span style={{fontSize:13,fontWeight:600,color:C.primary}}>{user}</span></div>
          <button type="button" onClick={onLogout} style={{background:"none",border:`1.5px solid ${C.line}`,borderRadius:8,padding:"5px 11px",cursor:"pointer",fontSize:12,color:C.faint,fontFamily:"inherit"}}>Log out</button>
        </div>
      </div>
    </div>

    <div style={{maxWidth:680,margin:"0 auto",padding:"22px 20px 80px"}}>

      {/* Hero */}
      <div style={{background:G.brand,borderRadius:18,padding:"22px 24px 20px",marginBottom:18,color:C.white}}>
        <div style={{fontSize:12,opacity:.75,marginBottom:3}}>{fmtDate(todayISOf,{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</div>
        <h2 style={{margin:"0 0 14px",fontSize:20,fontWeight:800}}>Good {new Date().getHours()<12?"morning":new Date().getHours()<17?"afternoon":"evening"}, {user.split(" ")[0]} 👋</h2>

        {!attRec&&!isPastAbsentThreshold()&&<button type="button" onClick={()=>setCheckInOpen(true)} style={{border:"none",borderRadius:10,padding:"12px 20px",background:C.white,color:C.primary,cursor:"pointer",fontSize:14,fontWeight:800,fontFamily:"inherit",display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:16}}>📋</span>Mark today's attendance</button>}
      {!attRec&&isPastAbsentThreshold()&&<div style={{background:"rgba(220,38,38,0.15)",borderRadius:10,padding:"12px 16px",fontSize:13}}>
        🔴 <strong>Marked absent</strong> — You did not log in before 11:30 AM. Contact your admin if this is incorrect.
      </div>}

        {attRec&&!isPresent&&<div style={{background:"rgba(255,255,255,0.15)",borderRadius:10,padding:"11px 14px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <AttBadge type={attRec.attendance}/>
          <button type="button" onClick={()=>setCheckInOpen(true)} style={{background:"rgba(255,255,255,0.2)",border:"none",borderRadius:8,padding:"6px 12px",cursor:"pointer",fontSize:12,color:C.white,fontFamily:"inherit"}}>Edit</button>
        </div>}

        {attRec&&isPresent&&<div style={{display:"flex",flexDirection:"column",gap:8}}>
          {/* Login / logout row */}
          <div style={{display:"flex",gap:8,alignItems:"stretch"}}>
            <div style={{background:"rgba(255,255,255,0.12)",borderRadius:10,padding:"10px 14px",flex:1}}>
              <div style={{fontSize:10,opacity:.6,marginBottom:2}}>ARRIVED</div>
              <div style={{fontSize:16,fontWeight:800}}>{firstLogin(sessions)||"—"}</div>
              {isLate(firstLogin(sessions))&&<div style={{fontSize:10,color:"#FCA5A5"}}>Late</div>}
            </div>
            <div style={{background:"rgba(255,255,255,0.12)",borderRadius:10,padding:"10px 14px",flex:1}}>
              <div style={{fontSize:10,opacity:.6,marginBottom:2}}>LEFT / NOW</div>
              <div style={{fontSize:16,fontWeight:800}}>{isDoneForDay?attRec.end_of_day:nowTime()}</div>
              <div style={{fontSize:10,opacity:.6}}>{isDoneForDay?"✅ done for day":isCheckedOut?"🍽️ on lunch":"🟢 still inside"}</div>
            </div>
            {isCurrentlyLoggedIn&&!isDoneForDay&&
              <button type="button" onClick={openEndDay} style={{border:"none",borderRadius:10,padding:"10px 14px",background:C.white,color:"#DC2626",cursor:"pointer",fontSize:12,fontWeight:700,fontFamily:"inherit",whiteSpace:"nowrap",flexShrink:0}}>🚪 End day</button>
            }
          </div>

          {/* 3-stat summary row */}
          {(()=>{
            const officeMins = totalOfficeMins(sessions,attRec)
            const workMins   = totalSessionMins(sessions)
            const breakMins  = totalBreakMins(sessions,attRec)
            return <div style={{display:"flex",gap:6}}>
              <div style={{flex:1,background:"rgba(255,255,255,0.12)",borderRadius:9,padding:"8px 10px",textAlign:"center"}}>
                <div style={{fontSize:9,opacity:.6,marginBottom:2,textTransform:"uppercase",letterSpacing:".04em"}}>In Office</div>
                <div style={{fontSize:14,fontWeight:800}}>{fmtDur(officeMins)}</div>
              </div>
              <div style={{flex:1,background:"rgba(79,210,143,0.2)",borderRadius:9,padding:"8px 10px",textAlign:"center",border:"1px solid rgba(79,210,143,0.3)"}}>
                <div style={{fontSize:9,opacity:.7,marginBottom:2,textTransform:"uppercase",letterSpacing:".04em"}}>Working</div>
                <div style={{fontSize:14,fontWeight:800,color:"#6EE7B7"}}>{fmtDur(workMins)}</div>
              </div>
              <div style={{flex:1,background:"rgba(255,193,7,0.15)",borderRadius:9,padding:"8px 10px",textAlign:"center",border:"1px solid rgba(255,193,7,0.2)"}}>
                <div style={{fontSize:9,opacity:.7,marginBottom:2,textTransform:"uppercase",letterSpacing:".04em"}}>Lunch</div>
                <div style={{fontSize:14,fontWeight:800,color:"#FDE68A"}}>{fmtDur(breakMins)||"—"}</div>
              </div>
            </div>
          })()}

          {/* 8-HOUR WARNING — show when logged in and <8h working time with time left in day */}
          {(()=>{
            const workMins=totalSessionMins(sessions)
            const minsNeeded=MIN_WORK_HOURS*60
            const remaining=minsNeeded-workMins
            const nowMins=(()=>{const n=new Date();return n.getHours()*60+n.getMinutes()})()
            const endMins=(()=>{const[h,m]=OFFICE_END.split(":").map(Number);return h*60+m})()
            const timeLeftInDay=Math.max(0,endMins-nowMins)
            // Show warning only if working and short on hours and office not over
            const showWarn=isCurrentlyLoggedIn&&workMins<minsNeeded&&timeLeftInDay>0
            if(!showWarn)return null
            const color=remaining>120?"#FCA5A5":remaining>60?"#FDE68A":"#86EFAC"
            const bg=remaining>120?"rgba(220,38,38,0.15)":remaining>60?"rgba(255,193,7,0.15)":"rgba(134,239,172,0.15)"
            return <div style={{background:bg,border:`1px solid ${color}40`,borderRadius:9,padding:"9px 12px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <span style={{fontSize:12,fontWeight:600,color}}>{remaining>60?`⏱ ${fmtDur(remaining)} more to complete 8h`:"🔥 Almost at 8h target!"}</span>
              <span style={{fontSize:11,color:"rgba(255,255,255,0.5)"}}>{fmtDur(workMins)} / 8h</span>
            </div>
          })()}

          {/* AFK STATUS PILL — visible when active/warning */}
          {isCurrentlyLoggedIn&&(()=>{
            const idleMin=Math.floor(idleSecs/60)
            if(afkState==="autoout")return null // banner handles it
            if(afkState==="warning")return(
              <div style={{background:"rgba(217,119,6,0.2)",border:"1px solid rgba(217,119,6,0.4)",borderRadius:8,padding:"7px 12px",display:"flex",alignItems:"center",gap:8,fontSize:12,fontWeight:600,color:"#FDE68A"}}>
                <span>😴</span>
                <span>Idle {idleMin}m — move mouse or press a key to stay active</span>
                <button type="button" onClick={resetAfk} style={{marginLeft:"auto",border:"none",borderRadius:6,padding:"4px 10px",background:"#FDE68A",color:"#78350F",cursor:"pointer",fontSize:11,fontWeight:800,fontFamily:"inherit"}}>I'm here</button>
              </div>
            )
            // active — show a small green dot + idle seconds if >1min
            if(idleMin>=1)return(
              <div style={{background:"rgba(255,255,255,0.07)",borderRadius:8,padding:"5px 10px",fontSize:11,color:"rgba(255,255,255,0.45)",display:"flex",alignItems:"center",gap:6}}>
                <span style={{width:6,height:6,borderRadius:"50%",background:"#4ADE80",display:"inline-block"}}/>
                Active · idle {idleMin}m {idleSecs%60}s (auto-pause at {AFK_IDLE_MINS}m)
              </div>
            )
            return null
          })()}

          {/* LUNCH BREAK BUTTON */}
          {isCurrentlyLoggedIn&&<button type="button" onClick={()=>openCheckOut("lunch")} style={{border:"1px solid rgba(255,193,7,0.4)",borderRadius:10,padding:"11px",background:"rgba(255,193,7,0.12)",color:"#FDE68A",cursor:"pointer",fontSize:14,fontWeight:700,fontFamily:"inherit",width:"100%"}}>
            🍽️ Going for lunch / stepping out
          </button>}

          {/* BACK FROM LUNCH */}
          {isCheckedOut&&<div style={{background:"rgba(255,193,7,0.15)",border:"1px solid rgba(255,193,7,0.35)",borderRadius:10,padding:"12px 16px",textAlign:"center"}}>
            <div style={{fontSize:12,fontWeight:600,color:"#FDE68A",marginBottom:8}}>☕ On lunch break · working timer paused</div>
            <button type="button" onClick={()=>setCheckInOpen(true)} style={{border:"none",borderRadius:8,padding:"9px 20px",background:C.white,color:"#7C3AED",cursor:"pointer",fontSize:13,fontWeight:800,fontFamily:"inherit"}}>
              ✅ Back from lunch — Re-login
            </button>
          </div>}

          {/* Break pills */}
          {sessions.length>1&&sessions.map((sess,i)=>i>0&&sessions[i-1].logout
            ?<div key={i} style={{background:"rgba(255,255,255,0.07)",borderRadius:8,padding:"5px 10px",fontSize:11,color:"rgba(255,255,255,0.5)",textAlign:"center"}}>
              ☕ Lunch {sessions[i-1].logout} → {sess.login} ({fmtDur(calcMins(sessions[i-1].logout,sess.login))}) — not in working time
            </div>:null
          )}
        </div>}
      </div>

      {/* ── ATTENDANCE SECTION ── */}
      <div style={{background:C.white,border:`1px solid ${C.line}`,borderRadius:14,padding:"16px 18px",marginBottom:14}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:attRec&&isPresent?12:0}}>
          <div>
            <div style={{fontWeight:700,fontSize:14,color:C.ink}}>Attendance</div>
            <div style={{fontSize:12,color:C.faint,marginTop:1}}>{attRec?ATT[attRec.attendance]?.label:"Not marked yet"}</div>
          </div>
          {attRec
            ?<AttBadge type={attRec.attendance}/>
            :isPastAbsentThreshold()
              ?<span style={{background:"#FEE2E2",color:C.danger,fontSize:12,fontWeight:700,padding:"4px 12px",borderRadius:99}}>🔴 Absent</span>
              :<button type="button" onClick={()=>setCheckInOpen(true)} style={{border:"none",borderRadius:8,padding:"8px 14px",background:G.brand,color:C.white,cursor:"pointer",fontSize:13,fontWeight:700,fontFamily:"inherit"}}>Mark now</button>
          }
        </div>
        {attRec&&isPresent&&<div style={{marginTop:10}}>
        {sessions.map((sess,i)=><React.Fragment key={i}>
          {i>0&&sessions[i-1].logout&&<div style={{background:"#FFFBEB",border:"1px solid #FDE68A",borderRadius:7,padding:"5px 10px",marginBottom:8,fontSize:11,fontWeight:600,color:"#92400E",display:"flex",alignItems:"center",gap:6}}>
            <span>☕</span><span>Lunch {sessions[i-1].logout}–{sess.login} ({fmtDur(calcMins(sessions[i-1].logout,sess.login))}) — not counted in office time</span>
          </div>}
          <div style={{display:"flex",gap:8,marginBottom:8}}>
            <div style={{flex:1,background:C.surface,borderRadius:8,padding:"9px 12px",border:`1px solid ${C.line}`}}>
              <div style={{fontSize:10,fontWeight:700,color:C.faint,textTransform:"uppercase",marginBottom:2}}>{sessions.length>1?`Session ${i+1} · `:""}Login</div>
              <div style={{fontSize:15,fontWeight:800,color:C.ink}}>{sess.login}</div>
              {isLate(sess.login)&&i===0&&<div style={{fontSize:10,color:C.danger,fontWeight:600}}>Late</div>}
            </div>
            <div style={{flex:1,background:sess.logout?C.surface:"#FFF7ED",borderRadius:8,padding:"9px 12px",border:`1px solid ${sess.logout?C.line:"#FDE68A"}`}}>
              <div style={{fontSize:10,fontWeight:700,color:C.faint,textTransform:"uppercase",marginBottom:2}}>Logout</div>
              {sess.logout
                ?<><div style={{fontSize:15,fontWeight:800,color:C.ink}}>{sess.logout}</div><div style={{fontSize:11,color:C.success,fontWeight:600}}>{fmtDur(calcMins(sess.login,sess.logout))}</div></>
                :<div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                  <div style={{fontSize:13,fontWeight:600,color:C.warning}}>Still in</div>
                  <button type="button" onClick={()=>openCheckOut("lunch")} style={{border:"none",borderRadius:6,padding:"4px 10px",background:C.warning,color:C.white,cursor:"pointer",fontSize:11,fontWeight:700,fontFamily:"inherit"}}>Log out</button>
                </div>
              }
            </div>
          </div>
        </React.Fragment>)}
        {sessions.length>0&&<PunchBar loginTime={firstLogin(sessions)} logoutTime={lastLogout(sessions)}/>}
        {(()=>{
          const officeMins=totalOfficeMins(sessions,attRec),workMins=totalSessionMins(sessions),breakMins=totalBreakMins(sessions,attRec)
          return officeMins>0&&<div style={{display:"flex",gap:6,marginTop:8}}>
            <div style={{flex:1,background:"#EEF2FF",borderRadius:8,padding:"7px 10px",textAlign:"center"}}>
              <div style={{fontSize:9,fontWeight:700,color:C.faint,textTransform:"uppercase",marginBottom:1}}>In Office</div>
              <div style={{fontSize:13,fontWeight:800,color:C.primary}}>{fmtDur(officeMins)}</div>
            </div>
            <div style={{flex:1,background:"#F0FDF4",borderRadius:8,padding:"7px 10px",textAlign:"center"}}>
              <div style={{fontSize:9,fontWeight:700,color:C.faint,textTransform:"uppercase",marginBottom:1}}>Working</div>
              <div style={{fontSize:13,fontWeight:800,color:C.success}}>{fmtDur(workMins)}</div>
            </div>
            <div style={{flex:1,background:"#FFFBEB",borderRadius:8,padding:"7px 10px",textAlign:"center"}}>
              <div style={{fontSize:9,fontWeight:700,color:C.faint,textTransform:"uppercase",marginBottom:1}}>Lunch</div>
              <div style={{fontSize:13,fontWeight:800,color:"#D97706"}}>{fmtDur(breakMins)||"—"}</div>
            </div>
          </div>
        })()}
        {isCheckedOut&&<div style={{marginTop:8,background:"#FFFBEB",border:"1px solid #FDE68A",borderRadius:10,padding:"10px 14px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{fontSize:12,fontWeight:600,color:"#92400E"}}>🍽️ On lunch break · working timer paused</div>
          <button type="button" onClick={()=>setCheckInOpen(true)} style={{border:"none",borderRadius:8,padding:"7px 14px",background:"#D97706",color:"#fff",cursor:"pointer",fontSize:12,fontWeight:700,fontFamily:"inherit"}}>✅ Back from lunch</button>
        </div>}
        {/* 8-hr target stat */}
        {isPresent&&(()=>{
          const workMins=totalSessionMins(sessions)
          const done=workMins>=(MIN_WORK_HOURS*60)
          const pct=Math.min(100,Math.round((workMins/(MIN_WORK_HOURS*60))*100))
          return <div style={{marginTop:8,background:"#F0FDF4",border:"1px solid #86EFAC",borderRadius:9,padding:"9px 12px"}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:5,fontSize:12,fontWeight:600,color:done?C.success:"#166534"}}>
              <span>🎯 Office hours target (10 AM – 7 PM)</span>
              <span>{fmtDur(workMins)} / 8h {done?"✅":""}</span>
            </div>
            <div style={{background:"#D1FAE5",borderRadius:99,height:5,overflow:"hidden"}}>
              <div style={{width:`${pct}%`,height:"100%",background:done?C.success:C.primary,borderRadius:99,transition:"width 0.3s"}}/>
            </div>
            {!done&&<div style={{fontSize:11,color:"#166534",marginTop:4}}>{fmtDur(Math.max(0,MIN_WORK_HOURS*60-workMins))} remaining to reach 8h target</div>}
          </div>
        })()}
      </div>}
      </div>

      {/* ── TASKS SECTION ── */}
      <div style={{background:C.white,border:`1px solid ${C.line}`,borderRadius:14,overflow:"hidden",marginBottom:14}}>
        <div style={{padding:"14px 18px",borderBottom:`1px solid ${C.line}`,display:"flex",alignItems:"center",justifyContent:"space-between",background:"linear-gradient(135deg,#F0FDF4,#DCFCE7)"}}>
          <div>
            <div style={{fontWeight:700,fontSize:15,color:"#14532D"}}>📝 Task log</div>
            <div style={{fontSize:12,color:"#166534",marginTop:1}}>
              {taskRecs.length===0?"Start your first task below":
                `${taskRecs.length} tasks · ${doneTasks.length} done · ${runningTasks.length} in progress · ${fmtDur(totalTaskMins)} total time`}
            </div>
          </div>
          {!attRec
            ?<button type="button" onClick={()=>setCheckInOpen(true)} style={{border:"none",borderRadius:10,padding:"10px 18px",background:"#D97706",color:C.white,cursor:"pointer",fontSize:13,fontWeight:700,fontFamily:"inherit",whiteSpace:"nowrap"}}>
              Mark attendance first →
            </button>
            :(!isPresent&&attRec?.attendance&&!["present"].includes(attRec.attendance))
            ?<span style={{fontSize:12,color:C.muted}}>N/A ({ATT[attRec.attendance]?.label||attRec.attendance})</span>
            :isCheckedOut
            ?<div style={{background:"#FFF7ED",border:"1px solid #FDE68A",borderRadius:10,padding:"8px 12px",fontSize:12,fontWeight:600,color:"#92400E",textAlign:"center"}}>🍽️ On break<br/><span style={{fontWeight:400,fontSize:11}}>Return to log tasks</span></div>
            :<button type="button" onClick={()=>setAddTaskOpen(true)} style={{border:"none",borderRadius:10,padding:"10px 18px",background:"#16A34A",color:C.white,cursor:"pointer",fontSize:14,fontWeight:800,fontFamily:"inherit",display:"flex",alignItems:"center",gap:6,boxShadow:"0 2px 8px rgba(22,163,74,0.3)"}}>
              <span style={{fontSize:16}}>▶</span> Start task
            </button>
          }
        </div>



        {attRec&&!isPresent&&!attRec.login_time&&<div style={{padding:"24px 20px",textAlign:"center",background:C.surface}}>
          <div style={{fontSize:13,color:C.muted}}>Task logging is only available when marked as Present.</div>
        </div>}

        {(isPresent||attRec?.login_time)&&taskRecs.length===0&&<div style={{padding:"32px 20px",textAlign:"center"}}>
          <div style={{fontSize:32,marginBottom:10}}>📝</div>
          <div style={{fontSize:14,fontWeight:700,color:C.ink}}>No tasks yet</div>
          <div style={{fontSize:13,marginTop:6,color:C.muted,lineHeight:1.6}}>
            Whenever you start working on something,<br/>click the green <strong style={{color:"#16A34A"}}>▶ Start task</strong> button above.<br/>
            Enter the task name and start time.<br/>
            When finished, click <strong>"Mark done"</strong>.
          </div>
        </div>}

        {(isPresent||attRec?.login_time)&&taskRecs.length>0&&<div style={{padding:"12px 14px",display:"flex",flexDirection:"column",gap:8}}>
          {taskRecs.map(t=><TaskCard key={t.id} task={t} canFinish={isPresent||!!attRec?.login_time} onFinish={setFinishTask} onDelete={setDelTarget} isAdmin={false}/>)}
        </div>}
      </div>

      {/* Month stats */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:18}}>
        {[
          {label:"Attendance %",value:`${attPct}%`,color:C.primary},
          {label:"Days present",value:presentDays.length,color:C.success},
          {label:"Tasks completed",value:records.filter(r=>r.name===user&&r.type==="task"&&r.status==="done").length,color:C.warning},
        ].map(s=><div key={s.label} style={{background:C.white,border:`1px solid ${C.line}`,borderRadius:12,padding:"13px 15px"}}>
          <div style={{fontSize:21,fontWeight:800,color:s.color}}>{s.value}</div>
          <div style={{fontSize:11,color:C.faint,marginTop:2}}>{s.label}</div>
        </div>)}
      </div>

      {/* Recent past days */}
      {(()=>{
        const pastDays=[...new Set(records.filter(r=>r.name===user&&r.date!==todayISOf).map(r=>r.date))].sort((a,b)=>b.localeCompare(a)).slice(0,5)
        if(!pastDays.length)return null
        return <>
          <h3 style={{margin:"0 0 12px",fontSize:14,fontWeight:700,color:C.ink}}>Recent days</h3>
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {pastDays.map(date=>{
              const dayAtt=records.find(r=>r.name===user&&r.date===date&&r.type==="attendance")
              const dayTasks=records.filter(r=>r.name===user&&r.date===date&&r.type==="task").sort((a,b)=>a.start_time?.localeCompare(b.start_time))
              const totalMins=calcMins(dayAtt?.login_time,dayAtt?.logout_time)
              const taskMins=dayTasks.reduce((s,t)=>s+calcMins(t.start_time,t.end_time),0)
              return <div key={date} style={{background:C.white,border:`1px solid ${C.line}`,borderRadius:12,overflow:"hidden"}}>
                <div style={{padding:"12px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",borderBottom:dayTasks.length?`1px solid ${C.line}`:"none"}}>
                  <div>
                    <div style={{fontWeight:600,fontSize:13,color:C.ink}}>{fmtDate(date,{weekday:"long",day:"numeric",month:"short"})}</div>
                    {dayAtt&&isPresent&&<div style={{fontSize:12,color:C.faint,marginTop:1}}>{dayAtt.login_time}–{dayAtt.logout_time||"—"} · {fmtDur(totalMins)}</div>}
                  </div>
                  {dayAtt&&<AttBadge type={dayAtt.attendance}/>}
                </div>
                {dayTasks.length>0&&<div style={{padding:"10px 14px",display:"flex",flexDirection:"column",gap:6}}>
                  {dayTasks.map(t=><div key={t.id} style={{display:"flex",alignItems:"center",gap:8,fontSize:12}}>
                    <span style={{width:7,height:7,borderRadius:"50%",flexShrink:0,background:t.status==="done"?C.success:t.status==="blocked"?C.danger:C.primary}}/>
                    <span style={{flex:1,color:t.status==="done"?C.muted:C.ink,textDecoration:t.status==="done"?"line-through":"none"}}>{t.task_name}</span>
                    <span style={{color:C.faint,whiteSpace:"nowrap"}}>{t.start_time}{t.end_time&&`→${t.end_time}`}</span>
                    <span style={{color:C.primary,fontWeight:600,whiteSpace:"nowrap"}}>{fmtDur(calcMins(t.start_time,t.end_time))}</span>
                  </div>)}
                  <div style={{fontSize:12,color:C.primary,fontWeight:600,paddingTop:4,borderTop:`1px solid ${C.line}`}}>Total task time: {fmtDur(taskMins)}</div>
                </div>}
              </div>
            })}
          </div>
        </>
      })()}
    </div>

    <CheckInModal open={checkInOpen} onClose={()=>setCheckInOpen(false)} onSave={onSave} user={user} existing={attRec}/>
    <AddTaskModal open={addTaskOpen} onClose={()=>setAddTaskOpen(false)} onSave={onSave} user={user}/>
    <TaskGateModal open={taskGateOpen} onClose={()=>setTaskGateOpen(false)} runningTasks={runningTasks} onSave={onSave} onProceed={()=>{setTaskGateOpen(false);setCheckOutMode("endday");setCheckOutOpen(true)}}/>
    <CheckOutModal open={checkOutOpen} onClose={()=>setCheckOutOpen(false)} onSave={onSave} attRecord={attRec} mode={checkOutMode}/>
    {finishTask&&<FinishTaskModal open={true} onClose={()=>setFinishTask(null)} onSave={onSave} task={finishTask}/>}
    <Confirm open={!!delTarget} title="Delete task?" body={delTarget?`Delete "${delTarget.task_name}"?`:""} onYes={async()=>{await onDelete(delTarget);setDelTarget(null)}} onNo={()=>setDelTarget(null)}/>
    <Toast msg={""} type={"success"}/>
  </div>
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function App(){
  const[employees,setEmployees]=useState([])
  const[records,setRecords]=useState([])  // all records (attendance + tasks unified)
  const[adminPin,setAdminPin]=useState("admin123")
  const[loading,setLoading]=useState(true)
  const[user,setUser]=useState(()=>{ try{return localStorage.getItem("tt_user")||null}catch{return null} })
  const[isAdmin,setAdmin]=useState(()=>{ try{return localStorage.getItem("tt_admin")==="1"}catch{return false} })
  const[view,setView]=useState("today")
  const[selMonth,setSelMonth]=useState(mk(todayISO()))
  const[empFilter,setEmpFilter]=useState("")
  const[delTarget,setDelTarget]=useState(null)
  const[newEmp,setNewEmp]=useState("")
  const[pinInput,setPinInput]=useState("")
  const[pinOpen,setPinOpen]=useState(false)
  const[pinErr,setPinErr]=useState("")
  const[newPin,setNewPin]=useState("")
  const[toast,setToast]=useState({msg:"",type:"success"})

  const showToast=useCallback((msg,type="success")=>{setToast({msg,type});setTimeout(()=>setToast({msg:"",type:"success"}),2600)},[])

  useEffect(()=>{
    async function load(){
      const[{data:emps},{data:reps},{data:sets}]=await Promise.all([
        sb.from("employees").select("name").order("name"),
        sb.from("reports").select("*").order("date",{ascending:false}),
        sb.from("settings").select("*")
      ])
      setEmployees((emps||[]).map(e=>e.name))
      setRecords(reps||[])
      const p=(sets||[]).find(s=>s.key==="admin_pin");if(p)setAdminPin(p.value)
      setLoading(false)
    }
    load()
  },[])

  // Realtime
  useEffect(()=>{
    const sub=sb.channel("rec-rt").on("postgres_changes",{event:"*",schema:"public",table:"reports"},p=>{
      if(p.eventType==="INSERT")setRecords(r=>[p.new,...r])
      if(p.eventType==="UPDATE")setRecords(r=>r.map(x=>x.id===p.new.id?p.new:x))
      if(p.eventType==="DELETE")setRecords(r=>r.filter(x=>x.id!==p.old.id))
    }).subscribe()
    const empSub=sb.channel("emp-rt").on("postgres_changes",{event:"*",schema:"public",table:"employees"},p=>{
      if(p.eventType==="INSERT")setEmployees(e=>[...e,p.new.name].sort())
      if(p.eventType==="DELETE")setEmployees(e=>e.filter(x=>x!==p.old.name))
    }).subscribe()
    return()=>{sub.unsubscribe();empSub.unsubscribe()}
  },[])

  const todayISOf=todayISO()
  const todayRecs=useMemo(()=>records.filter(r=>r.date===todayISOf),[records,todayISOf])
  const monthRecs=useMemo(()=>records.filter(r=>mk(r.date)===selMonth),[records,selMonth])
  const months=useMemo(()=>{const s=new Set(records.map(r=>mk(r.date)));s.add(mk(todayISOf));return Array.from(s).sort((a,b)=>b.localeCompare(a))},[records,todayISOf])

  // Today: employees who marked attendance
  const todayMarked=new Set(todayRecs.filter(r=>r.type==="attendance").map(r=>r.name))
  const autoAbsent=isPastAbsentThreshold()
  // After 11:30, unmarked employees are auto-absent
  const notYet=employees.filter(e=>!todayMarked.has(e)&&!autoAbsent)
  const autoAbsentList=employees.filter(e=>!todayMarked.has(e)&&autoAbsent)

  // Monthly working days
  const wdSoFar=useMemo(()=>workingDaysSoFar(selMonth),[selMonth])
  const chartData=useMemo(()=>wdSoFar.slice(-10).map(d=>({
    label:new Date(d+"T00:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short"}),
    value:records.filter(r=>r.date===d&&r.type==="attendance"&&r.attendance==="present").length,
    highlight:d===todayISOf
  })),[records,wdSoFar,todayISOf])

  // Group today's records by employee
  const todayByEmp=useMemo(()=>{
    // Include employees with records
    const withRecs=[...new Set(todayRecs.map(r=>r.name))]
    // Include auto-absent employees (past 11:30, no record)
    const allNames=empFilter?[empFilter]:[...new Set([...withRecs,...(autoAbsent?employees.filter(e=>!todayMarked.has(e)):[])])].sort()
    return allNames.map(name=>({
      name,
      recs:todayRecs.filter(r=>r.name===name),
      autoAbsent:autoAbsent&&!todayMarked.has(name)
    }))
  },[todayRecs,empFilter,employees,todayMarked,autoAbsent])

  // Group monthly records by date then employee
  const monthGrouped=useMemo(()=>{
    const filtered=empFilter?monthRecs.filter(r=>r.name===empFilter):monthRecs
    const dates=[...new Set(filtered.map(r=>r.date))].sort((a,b)=>b.localeCompare(a))
    return dates.map(date=>({
      date,
      employees:[...new Set(filtered.filter(r=>r.date===date).map(r=>r.name))].sort().map(name=>({
        name, recs:filtered.filter(r=>r.date===date&&r.name===name)
      }))
    }))
  },[monthRecs,empFilter])

  async function saveRecord(rec){
    const payload={
      id:rec.id, name:rec.name, date:rec.date,
      type:rec.type||"attendance",
      attendance:rec.attendance||null,
      login_time:rec.login_time||null,
      logout_time:rec.logout_time||null,
      summary:rec.summary||null,
      task_name:rec.task_name||null,
      start_time:rec.start_time||null,
      end_time:rec.end_time||null,
      status:rec.status||null,
      tasks:rec.tasks||null,
      leave_type:rec.leave_type||null,
      sessions:rec.sessions||null
    }
    const exists=records.some(r=>r.id===rec.id)

    // ── Optimistic update: update UI immediately, don't wait for realtime ──
    if(exists){
      setRecords(r=>r.map(x=>x.id===payload.id?{...x,...payload}:x))
      await sb.from("reports").update(payload).eq("id",rec.id)
    } else {
      setRecords(r=>[payload,...r])
      await sb.from("reports").insert(payload)
    }
    if(!employees.includes(rec.name)){await sb.from("employees").insert({name:rec.name})}
    showToast(exists?"Updated ✓":"Saved ✓")
  }

  async function deleteRecord(rec){
    // Optimistic remove
    setRecords(r=>r.filter(x=>x.id!==rec.id))
    await sb.from("reports").delete().eq("id",rec.id)
    showToast("Deleted.")
  }

  async function addEmployee(){
    const name=newEmp.trim();if(!name)return
    if(employees.includes(name)){showToast("Already exists.","error");return}
    await sb.from("employees").insert({name})
    setNewEmp("");showToast(`${name} added.`)
  }
  async function removeEmployee(name){await sb.from("employees").delete().eq("name",name);showToast(`${name} removed.`)}
  async function updatePin(){if(!newPin.trim())return;await sb.from("settings").update({value:newPin.trim()}).eq("key","admin_pin");setAdminPin(newPin.trim());setNewPin("");showToast("PIN updated ✓")}

  function exportCSV(){
    const rows=[["Date","Employee","Type","Attendance","Login","Logout","Total Hours","Task","Start","End","Duration","Status"]]
    ;[...records].sort((a,b)=>b.date.localeCompare(a.date)||a.name.localeCompare(b.name)).forEach(r=>{
      if(r.type==="attendance"){rows.push([r.date,r.name,"attendance",r.attendance||"",r.login_time||"",r.logout_time||"",fmtDur(calcMins(r.login_time,r.logout_time)),"","","","",""])}
      else if(r.type==="task"){rows.push([r.date,r.name,"task","","","","",`"${(r.task_name||"").replace(/"/g,'""')}"`,r.start_time||"",r.end_time||"",fmtDur(calcMins(r.start_time,r.end_time)),r.status||""])}
    })
    const a=document.createElement("a")
    a.href=URL.createObjectURL(new Blob([rows.map(r=>r.join(",")).join("\n")],{type:"text/csv"}))
    a.download=`teamtrack-${todayISO()}.csv`;a.click()
  }

  const NAV=[{id:"today",label:"Today"},{id:"monthly",label:"Monthly"},{id:"dashboard",label:"Dashboard"},...(isAdmin?[{id:"manage",label:"Manage"}]:[])]

  if(loading)return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:G.canvas}}><div style={{textAlign:"center"}}><div style={{width:40,height:40,borderRadius:10,background:G.brand,margin:"0 auto 12px",display:"flex",alignItems:"center",justifyContent:"center"}}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.5" strokeLinecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div><div style={{fontSize:14,color:C.muted}}>Loading TeamTrack…</div></div></div>

  // ── LOGIN ──
  if(!user)return(
    <div style={{minHeight:"100vh",background:G.canvas,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{background:C.white,borderRadius:22,boxShadow:"0 24px 64px rgba(79,70,229,0.13)",padding:"44px 40px 36px",width:"100%",maxWidth:420}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:28}}>
          <div style={{width:48,height:48,borderRadius:13,background:G.brand,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.2" strokeLinecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
          <div><h1 style={{margin:0,fontSize:24,fontWeight:800,color:"#1E1B4B",letterSpacing:"-0.5px"}}>TeamTrack</h1><p style={{margin:0,fontSize:12,color:C.faint}}>Daily work · Attendance · Task tracking</p></div>
        </div>
        <label style={LBL}>Select your name</label>
        {employees.length===0
          ?<div style={{padding:"18px",background:C.surface,borderRadius:10,fontSize:13,color:C.muted,textAlign:"center",marginBottom:16}}>No employees yet.<br/>Ask admin to add you first.</div>
          :<select defaultValue="" onChange={e=>{if(e.target.value){setUser(e.target.value);try{localStorage.setItem("tt_user",e.target.value);localStorage.removeItem("tt_admin")}catch{}}}} style={{...INP,marginBottom:20,fontSize:15,appearance:"none"}}>
            <option value="" disabled>— choose your name —</option>
            {employees.map(e=><option key={e} value={e}>{e}</option>)}
          </select>
        }
        <div style={{borderTop:`1px dashed ${C.line}`,paddingTop:16,textAlign:"center"}}>
          <button type="button" onClick={()=>{setPinInput("");setPinErr("");setPinOpen(true)}} style={{background:"none",border:"none",color:C.primary,cursor:"pointer",fontSize:13,fontWeight:600}}>Admin login →</button>
        </div>
      </div>
      <Modal open={pinOpen} onClose={()=>setPinOpen(false)} width={340}>
        <div style={{padding:"24px 26px"}}>
          <h3 style={{margin:"0 0 4px",fontSize:17,fontWeight:700,color:C.ink}}>Admin access</h3>
          <p style={{margin:"0 0 16px",fontSize:13,color:C.muted}}>Enter admin PIN to continue.</p>
          <input type="password" value={pinInput} onChange={e=>setPinInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"){if(pinInput===adminPin){setAdmin(true);setUser("Admin");setPinOpen(false);try{localStorage.setItem("tt_user","Admin");localStorage.setItem("tt_admin","1")}catch{}}else setPinErr("Incorrect PIN.")}}} placeholder="Admin PIN" style={{...INP,marginBottom:6}} autoFocus/>
          {pinErr&&<p style={{color:C.danger,fontSize:12,margin:"0 0 10px",fontWeight:600}}>{pinErr}</p>}
          <div style={{display:"flex",gap:9,marginTop:14}}>
            <button type="button" onClick={()=>setPinOpen(false)} style={{flex:1,padding:"10px",border:`1.5px solid ${C.line}`,borderRadius:9,background:"none",cursor:"pointer",fontSize:14,fontFamily:"inherit",color:C.muted}}>Cancel</button>
            <button type="button" onClick={()=>{if(pinInput===adminPin){setAdmin(true);setUser("Admin");setPinOpen(false);try{localStorage.setItem("tt_user","Admin");localStorage.setItem("tt_admin","1")}catch{}}else setPinErr("Incorrect PIN.")}} style={{flex:1,padding:"10px",border:"none",borderRadius:9,background:G.brand,color:C.white,cursor:"pointer",fontSize:14,fontWeight:700,fontFamily:"inherit"}}>Sign in</button>
          </div>
        </div>
      </Modal>
    </div>
  )

  // ── EMPLOYEE VIEW ──
  if(!isAdmin)return <EmpDashboard user={user} records={records} onSave={saveRecord} onDelete={deleteRecord} showToast={showToast} onLogout={()=>{setUser(null);try{localStorage.removeItem("tt_user");localStorage.removeItem("tt_admin")}catch{}}}/>

  // ── ADMIN VIEW ──
  return(
    <div style={{minHeight:"100vh",background:C.surface}}>
      <div style={{background:C.white,borderBottom:`1px solid ${C.line}`,position:"sticky",top:0,zIndex:50}}>
        <div style={{maxWidth:1000,margin:"0 auto",padding:"0 20px",display:"flex",alignItems:"center",gap:8,height:56}}>
          <div style={{width:28,height:28,borderRadius:7,background:G.brand,display:"flex",alignItems:"center",justifyContent:"center"}}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.5" strokeLinecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div>
          <span style={{fontWeight:800,fontSize:14,color:"#1E1B4B"}}>TeamTrack</span>
          <nav style={{display:"flex",gap:1,marginLeft:14}}>{NAV.map(n=><button key={n.id} type="button" onClick={()=>setView(n.id)} style={{padding:"6px 13px",border:"none",borderRadius:8,cursor:"pointer",fontSize:12.5,fontWeight:view===n.id?700:500,background:view===n.id?"#EEF2FF":"none",color:view===n.id?C.primary:C.muted,fontFamily:"inherit"}}>{n.label}</button>)}</nav>
          <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:8}}>
            <button type="button" onClick={exportCSV} style={{padding:"6px 12px",border:`1.5px solid ${C.line}`,borderRadius:8,background:"none",cursor:"pointer",fontSize:12,color:C.muted,fontFamily:"inherit"}}>Export CSV</button>
            <div style={{background:G.soft,padding:"4px 11px",borderRadius:99,display:"flex",alignItems:"center",gap:6}}><span style={{fontSize:10,background:G.brand,color:C.white,padding:"1px 7px",borderRadius:99,fontWeight:700}}>ADMIN</span></div>
            <button type="button" onClick={()=>{setUser(null);setAdmin(false);setView("today");try{localStorage.removeItem("tt_user");localStorage.removeItem("tt_admin")}catch{}}} style={{background:"none",border:`1.5px solid ${C.line}`,borderRadius:8,padding:"5px 10px",cursor:"pointer",fontSize:12,color:C.faint,fontFamily:"inherit"}}>Log out</button>
          </div>
        </div>
      </div>

      <div style={{maxWidth:1000,margin:"0 auto",padding:"24px 20px 80px"}}>

        {/* TODAY */}
        {view==="today"&&<>
          <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:10,marginBottom:18}}>
            {[
              {label:"Present",value:todayRecs.filter(r=>r.type==="attendance"&&r.attendance==="present").length,color:C.success},
              {label:"Late",value:todayRecs.filter(r=>r.type==="attendance"&&isLate(r.login_time)).length,color:C.danger},
              {label:"Leave/WFH",value:todayRecs.filter(r=>r.type==="attendance"&&["leave","sick","wfh","halfday"].includes(r.attendance)).length,color:C.warning},
              {label:"Absent",value:todayRecs.filter(r=>r.type==="attendance"&&r.attendance==="absent").length+autoAbsentList.length,color:C.danger},
              {label:"Not marked",value:notYet.length,color:"#CBD5E1"},
            ].map(s=><div key={s.label} style={{background:C.white,border:`1px solid ${C.line}`,borderRadius:11,padding:"13px 14px"}}><div style={{fontSize:24,fontWeight:800,color:s.color}}>{s.value}</div><div style={{fontSize:11,color:C.faint,marginTop:1}}>{s.label}</div></div>)}
          </div>

          {notYet.length>0&&<div style={{background:"#FFFBEB",border:"1px solid #FDE68A",borderRadius:10,padding:"10px 16px",marginBottom:12,display:"flex",alignItems:"center",flexWrap:"wrap",gap:7}}>
            <span style={{fontSize:12,fontWeight:700,color:"#92400E"}}>⏳ Not marked yet:</span>
            {notYet.map(n=><span key={n} style={{fontSize:12,background:"#FEF9C3",color:"#92400E",padding:"2px 9px",borderRadius:99,fontWeight:600}}>{n}</span>)}
          </div>}
          {autoAbsentList.length>0&&<div style={{background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:10,padding:"10px 16px",marginBottom:12,display:"flex",alignItems:"center",flexWrap:"wrap",gap:7}}>
            <span style={{fontSize:12,fontWeight:700,color:C.danger}}>🔴 Auto-marked absent (past 11:30 AM):</span>
            {autoAbsentList.map(n=><span key={n} style={{fontSize:12,background:"#FEE2E2",color:C.danger,padding:"2px 9px",borderRadius:99,fontWeight:600}}>{n}</span>)}
            <span style={{fontSize:11,color:C.faint,marginLeft:"auto"}}>Admin can override</span>
          </div>}

          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:10}}>
            <h2 style={{margin:0,fontSize:16,fontWeight:700,color:C.ink}}>{fmtDate(todayISOf,{weekday:"long",day:"numeric",month:"long"})}</h2>
            <select value={empFilter} onChange={e=>setEmpFilter(e.target.value)} style={{padding:"6px 11px",border:`1.5px solid ${C.line}`,borderRadius:8,fontSize:12,fontFamily:"inherit",outline:"none",color:C.muted}}>
              <option value="">All employees</option>{employees.map(e=><option key={e} value={e}>{e}</option>)}
            </select>
          </div>

          {todayByEmp.length===0
            ?<div style={{textAlign:"center",padding:"56px 20px",background:C.white,borderRadius:13,border:`1px solid ${C.line}`,color:C.faint}}><div style={{fontSize:32,marginBottom:8}}>📋</div><div style={{fontSize:15,fontWeight:600,color:C.muted}}>No reports yet today</div></div>
            :<div style={{display:"flex",flexDirection:"column",gap:12}}>{todayByEmp.map(({name,recs,autoAbsent:isAutoAbsent})=><AdminEmployeeDay key={name} name={name} date={todayISOf} records={recs} onSave={saveRecord} onDelete={deleteRecord} employees={employees} autoAbsent={isAutoAbsent}/>)}</div>
          }
        </>}

        {/* MONTHLY */}
        {view==="monthly"&&<>
          <div style={{display:"flex",gap:10,marginBottom:18,flexWrap:"wrap",alignItems:"center"}}>
            <select value={selMonth} onChange={e=>setSelMonth(e.target.value)} style={{padding:"8px 13px",border:`1.5px solid ${C.line}`,borderRadius:9,fontSize:14,fontFamily:"inherit",outline:"none",background:C.white,color:C.ink,fontWeight:700}}>{months.map(m=><option key={m} value={m}>{fmtMonth(m)}</option>)}</select>
            <select value={empFilter} onChange={e=>setEmpFilter(e.target.value)} style={{padding:"8px 13px",border:`1.5px solid ${C.line}`,borderRadius:9,fontSize:13,fontFamily:"inherit",outline:"none",background:C.white,color:C.muted}}>
              <option value="">All employees</option>{employees.map(e=><option key={e} value={e}>{e}</option>)}
            </select>
            {empFilter&&<button type="button" onClick={()=>setEmpFilter("")} style={{background:"none",border:"none",color:C.primary,cursor:"pointer",fontSize:13,fontWeight:600}}>Clear ×</button>}
          </div>

          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:22}}>
            {[
              {label:"Present days",value:monthRecs.filter(r=>r.type==="attendance"&&r.attendance==="present").length,color:C.success},
              {label:"Late arrivals",value:monthRecs.filter(r=>r.type==="attendance"&&isLate(r.login_time)).length,color:C.danger},
              {label:"Tasks completed",value:monthRecs.filter(r=>r.type==="task"&&r.status==="done").length,color:C.primary},
              {label:"Leave/WFH days",value:monthRecs.filter(r=>r.type==="attendance"&&["leave","sick","wfh","halfday"].includes(r.attendance)).length,color:C.warning},
            ].map(s=><div key={s.label} style={{background:C.white,border:`1px solid ${C.line}`,borderRadius:11,padding:"13px 14px"}}><div style={{fontSize:24,fontWeight:800,color:s.color}}>{s.value}</div><div style={{fontSize:11,color:C.faint,marginTop:1}}>{s.label}</div></div>)}
          </div>

          {monthGrouped.length===0
            ?<div style={{textAlign:"center",padding:"56px 20px",background:C.white,borderRadius:13,border:`1px solid ${C.line}`,color:C.faint}}><div style={{fontSize:32,marginBottom:8}}>📅</div><div style={{fontSize:15,fontWeight:600,color:C.muted}}>No data for {fmtMonth(selMonth)}</div></div>
            :monthGrouped.map(({date,employees:emps})=><div key={date} style={{marginBottom:24}}>
              <div style={{fontSize:11,fontWeight:700,color:C.faint,textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:10,paddingBottom:7,borderBottom:`1px solid ${C.line}`}}>
                {fmtDate(date,{weekday:"long",day:"numeric",month:"long"})} · {emps.length} report{emps.length!==1?"s":""}
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:10}}>{emps.map(({name,recs})=><AdminEmployeeDay key={name} name={name} date={date} records={recs} onSave={saveRecord} onDelete={deleteRecord} employees={employees}/>)}</div>
            </div>)
          }
        </>}

        {/* DASHBOARD */}
        {view==="dashboard"&&<>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:20}}>
            <h2 style={{margin:0,fontSize:18,fontWeight:700,color:C.ink}}>Team Dashboard</h2>
            <select value={selMonth} onChange={e=>setSelMonth(e.target.value)} style={{marginLeft:"auto",padding:"7px 12px",border:`1.5px solid ${C.line}`,borderRadius:9,fontSize:13,fontFamily:"inherit",outline:"none",background:C.white,color:C.ink,fontWeight:700}}>{months.map(m=><option key={m} value={m}>{fmtMonth(m)}</option>)}</select>
          </div>
          <div style={{background:C.white,border:`1px solid ${C.line}`,borderRadius:14,padding:"20px 22px",marginBottom:14}}>
            <div style={{fontSize:13,fontWeight:700,color:C.muted,marginBottom:14}}>Daily attendance — last 10 working days</div>
            <BarChart data={chartData}/>
          </div>
          <div style={{background:C.white,border:`1px solid ${C.line}`,borderRadius:14,overflow:"hidden"}}>
            <div style={{padding:"15px 20px",borderBottom:`1px solid ${C.line}`,display:"flex",justifyContent:"space-between"}}>
              <div style={{fontSize:15,fontWeight:700,color:C.ink}}>Employee breakdown · {fmtMonth(selMonth)}</div>
              <div style={{fontSize:12,color:C.faint}}>{wdSoFar.length} working days</div>
            </div>
            {employees.length===0?<div style={{padding:"40px",textAlign:"center",color:C.faint}}>No employees yet.</div>:employees.map(name=>{
              const reps=monthRecs.filter(r=>r.name===name&&r.type==="attendance")
              const tasks=monthRecs.filter(r=>r.name===name&&r.type==="task")
              const present=reps.filter(r=>r.attendance==="present").length
              const late=reps.filter(r=>isLate(r.login_time)).length
              const doneTasks=tasks.filter(t=>t.status==="done").length
              const tPct=tasks.length?Math.round((doneTasks/tasks.length)*100):null
              const attPct=wdSoFar.length?Math.round((present/wdSoFar.length)*100):0
              const totalMins=reps.reduce((s,r)=>s+calcMins(r.login_time,r.logout_time),0)
              const avgMins=present?Math.round(totalMins/present):0
              const taskMins=tasks.reduce((s,t)=>s+calcMins(t.start_time,t.end_time),0)
              return <div key={name} style={{padding:"14px 20px",borderBottom:`1px solid ${C.surface}`,display:"flex",alignItems:"center",gap:14,flexWrap:"wrap"}}>
                <Avatar name={name} size={40}/>
                <div style={{flex:1,minWidth:120}}>
                  <div style={{fontWeight:700,fontSize:14,color:C.ink}}>{name}</div>
                  <div style={{fontSize:12,color:C.faint,marginTop:2}}>
                    {present}d present · {late>0&&<span style={{color:C.danger}}>{late} late · </span>}avg {fmtDur(avgMins)}/day · tasks: {fmtDur(taskMins)}
                  </div>
                  {late>2&&<div style={{marginTop:5,background:"#FEF2F2",borderRadius:6,padding:"3px 8px",fontSize:11,color:C.danger,fontWeight:600,display:"inline-block"}}>⚠ Late {late}× this month</div>}
                </div>
                <div style={{display:"flex",gap:12,alignItems:"center"}}>
                  <Donut pct={attPct} color={C.primary} size={52} label="Attendance"/>
                  {tPct!==null&&<Donut pct={tPct} color={C.success} size={52} label="Tasks done"/>}
                </div>
              </div>
            })}
          </div>
        </>}

        {/* MANAGE */}
        {view==="manage"&&<>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:18}}>
            <div style={{background:C.white,border:`1px solid ${C.line}`,borderRadius:14,padding:"22px"}}>
              <h3 style={{margin:"0 0 14px",fontSize:15,fontWeight:700,color:C.ink}}>Add employee</h3>
              <div style={{display:"flex",gap:9}}><input value={newEmp} onChange={e=>setNewEmp(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addEmployee()}} placeholder="Full name" style={{...INP,flex:1}}/><button type="button" onClick={addEmployee} style={{padding:"9px 18px",border:"none",borderRadius:9,background:G.brand,color:C.white,cursor:"pointer",fontSize:14,fontWeight:700,fontFamily:"inherit",whiteSpace:"nowrap"}}>Add</button></div>
            </div>
            <div style={{background:C.white,border:`1px solid ${C.line}`,borderRadius:14,padding:"22px"}}>
              <h3 style={{margin:"0 0 14px",fontSize:15,fontWeight:700,color:C.ink}}>Change admin PIN</h3>
              <div style={{display:"flex",gap:9}}><input type="password" value={newPin} onChange={e=>setNewPin(e.target.value)} placeholder="New PIN" style={{...INP,flex:1}}/><button type="button" onClick={updatePin} style={{padding:"9px 18px",border:"none",borderRadius:9,background:G.brand,color:C.white,cursor:"pointer",fontSize:14,fontWeight:700,fontFamily:"inherit"}}>Update</button></div>
            </div>
          </div>

          <div style={{background:C.white,border:`1px solid ${C.line}`,borderRadius:14,overflow:"hidden",marginBottom:16}}>
            <div style={{padding:"15px 22px",borderBottom:`1px solid ${C.line}`}}><h3 style={{margin:0,fontSize:15,fontWeight:700,color:C.ink}}>Team · {employees.length} members</h3></div>
            {employees.length===0?<div style={{padding:"40px",textAlign:"center",color:C.faint,fontSize:14}}>No employees yet.</div>:employees.map((name,i)=>{
              const last=records.filter(r=>r.name===name&&r.type==="attendance").sort((a,b)=>b.date.localeCompare(a.date))[0]
              const totalRecs=records.filter(r=>r.name===name)
              return <div key={name} style={{display:"flex",alignItems:"center",gap:13,padding:"13px 22px",borderTop:i===0?"none":`1px solid ${C.surface}`}}>
                <Avatar name={name} size={36}/>
                <div style={{flex:1}}><div style={{fontWeight:600,fontSize:14,color:C.ink}}>{name}</div><div style={{fontSize:12,color:C.faint}}>{last?`Last: ${fmtDate(last.date)}`:"No records yet"} · {totalRecs.filter(r=>r.type==="attendance").length} days logged</div></div>
                <button type="button" onClick={()=>removeEmployee(name)} style={{background:"none",border:"1px solid #FECACA",borderRadius:7,padding:"5px 12px",cursor:"pointer",fontSize:12,color:C.danger,fontFamily:"inherit"}}>Remove</button>
              </div>
            })}
          </div>

          <div style={{background:C.white,border:`1px solid ${C.line}`,borderRadius:14,padding:"22px"}}>
            <h3 style={{margin:"0 0 6px",fontSize:15,fontWeight:700,color:C.ink}}>Backup &amp; Export</h3>
            <p style={{fontSize:13,color:C.faint,margin:"0 0 16px",lineHeight:1.6}}>Exports attendance and every task record separately with start/finish times — open in Excel for full analysis.</p>
            <button type="button" onClick={exportCSV} style={{padding:"11px 22px",border:"none",borderRadius:10,background:G.brand,color:C.white,cursor:"pointer",fontSize:14,fontWeight:700,display:"flex",alignItems:"center",gap:8,fontFamily:"inherit"}}>Download CSV backup</button>
          </div>
        </>}

      </div>

      <Confirm open={!!delTarget} title="Delete?" body={delTarget?`Delete this record?`:""} onYes={async()=>{await deleteRecord(delTarget);setDelTarget(null)}} onNo={()=>setDelTarget(null)}/>
      <Toast msg={toast.msg} type={toast.type}/>
    </div>
  )
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>)
</script>
</body>
</html>
